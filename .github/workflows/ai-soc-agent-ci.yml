name: AI SOC Agent CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-soc-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest -v

      - name: Validate sample alert JSON
        run: |
          python3 -m json.tool sample-alerts/rule-100101-alert-redacted.json >/dev/null
          python3 -m json.tool sample-alerts/benign-ssh-login-redacted.json >/dev/null

      - name: Dry-run offline triage agent
        run: |
          python3 agent/offline_triage.py \
            --alert sample-alerts/rule-100101-alert-redacted.json \
            --output-dir ./reports \
            --dry-run
        
      - name: Install test dependencies
        run: pip install pytest ruff

      - name: Lint
        run: ruff check agent/ tests/
